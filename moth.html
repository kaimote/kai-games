<!doctype html>
<html lang="en">
<head>
<meta name="author" content="Kai">
<!-- (c) 2026 Kai. All rights reserved. Made for fun, not perfection. -->

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>moth</title>
<style>
  html, body { margin:0; height:100%; background:#0a0d16; overflow:hidden; cursor:none; }
  canvas { display:block; width:100vw; height:100vh; }
  .hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:#8b96c4; letter-spacing:.04em; user-select:none; pointer-events:none;
    opacity:.7; transition:opacity 1.4s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move — they want your light</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const mouse = { x: W/2, y: H/2, active:false, vx:0, vy:0, px:W/2, py:H/2 };
window.addEventListener('pointermove', e => {
  mouse.vx = e.clientX - mouse.x; mouse.vy = e.clientY - mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  hint.style.opacity = 0;
});
window.addEventListener('pointerleave', () => { mouse.active = false; });

const moths = [];
const N = 7;
function seed(m, fresh){
  // spawn somewhere around the screen
  m.x = Math.random()*W;
  m.y = Math.random()*H;
  m.size = 5 + Math.random()*4;
  m.angle = Math.random()*Math.PI*2;
  m.flap = Math.random()*Math.PI*2;
  m.flapSpeed = 22 + Math.random()*14;   // wingbeats/sec, fast
  m.orbitR = 60 + Math.random()*120;
  m.orbitSpeed = 0.6 + Math.random()*1.1;
  m.jitter = 0.4 + Math.random()*0.7;
  m.tone = 0.35 + Math.random()*0.3;     // how warm/bright they read
  m.mode = 'drift';                        // drift | dive | flee
  m.modeT = 1 + Math.random()*3;
  m.diveVx = 0; m.diveVy = 0;
}
for(let i=0;i<N;i++){ const m={}; seed(m, true); moths.push(m); }

let last = performance.now();
function step(now){
  let dt = (now - last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;
  const t = now/1000;

  // gentle fade trail for softness
  ctx.fillStyle = 'rgba(10,13,22,0.55)';
  ctx.fillRect(0,0,W,H);

  // your point of light
  const glowR = 90;
  if(mouse.active){
    const g = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,glowR);
    g.addColorStop(0,'rgba(255,240,205,0.16)');
    g.addColorStop(0.5,'rgba(255,225,170,0.05)');
    g.addColorStop(1,'rgba(255,225,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,glowR,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,247,228,0.92)';
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,2.4,0,Math.PI*2); ctx.fill();
  }

  for(const m of moths){
    m.modeT -= dt;
    if(m.modeT <= 0){
      // decide a mood
      if(mouse.active){
        const d = Math.hypot(m.x-mouse.x, m.y-mouse.y);
        if(d < 260 && Math.random() < 0.55){
          m.mode = 'dive';
          const ang = Math.atan2(mouse.y-m.y, mouse.x-m.x);
          m.diveVx = Math.cos(ang)*150; m.diveVy = Math.sin(ang)*150;
        } else if(d < 90){
          m.mode = 'flee';
          const ang = Math.atan2(m.y-mouse.y, m.x-mouse.x);
          m.diveVx = Math.cos(ang)*120; m.diveVy = Math.sin(ang)*120;
        } else {
          m.mode = 'drift';
        }
      } else {
        m.mode = 'drift';
      }
      m.modeT = 0.6 + Math.random()*1.8;
      if(m.mode === 'dive') m.modeT = 0.5 + Math.random()*0.4;
    }

    m.flap += m.flapSpeed*dt;

    if(m.mode === 'drift'){
      // loose wander around a slowly moving anchor
      m.angle += m.orbitSpeed*dt;
      const ax = mouse.x + Math.cos(m.angle)*m.orbitR;
      const ay = mouse.y + Math.sin(m.angle*0.8)*m.orbitR*0.6;
      m.x += (ax - m.x)*dt*1.4 + Math.sin(t*1.3 + m.size)*m.jitter*18*dt*10;
      m.y += (ay - m.y)*dt*1.4 + Math.cos(t*1.1 + m.size)*m.jitter*18*dt*10;
    } else {
      m.x += m.diveVx*dt; m.y += m.diveVy*dt;
      // ease off
      m.diveVx *= (1 - dt*1.6); m.diveVy *= (1 - dt*1.6);
    }

    // keep on screen (wrap-ish)
    if(m.x < -20) m.x = W+20; if(m.x > W+20) m.x = -20;
    if(m.y < -20) m.y = H+20; if(m.y > H+20) m.y = -20;

    // draw moth: two wings flapping, tiny body
    const flapAmt = Math.sin(m.flap)*0.7 + 0.3;      // 0.3..1 wing spread
    const bodyAng = m.mode==='drift' ? m.angle + Math.PI/2 : Math.atan2(m.diveVy,m.diveVx)+Math.PI/2;
    const spread = m.size * (0.6 + flapAmt*0.9);
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(bodyAng);
    // wings
    ctx.fillStyle = 'rgba(150,150,180,' + (0.16 + m.tone*0.14).toFixed(3) + ')';
    // left
    ctx.beginPath();
    ctx.ellipse(-spread*0.5, 0, spread*0.55, m.size*0.9*flapAmt, 0.4, 0, Math.PI*2);
    ctx.fill();
    // right
    ctx.beginPath();
    ctx.ellipse(spread*0.5, 0, spread*0.55, m.size*0.9*flapAmt, -0.4, 0, Math.PI*2);
    ctx.fill();
    // body
    ctx.fillStyle = 'rgba(210,200,190,' + (0.4 + m.tone*0.3).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(0, 0, m.size*0.28, m.size*0.7, 0, 0, Math.PI*2);
    ctx.fill();
    // little highlight where light catches them
    if(mouse.active){
      const d = Math.hypot(m.x-mouse.x, m.y-mouse.y);
      if(d < glowR){
        const s = (1 - d/glowR);
        ctx.fillStyle = 'rgba(255,240,200,' + (s*0.25).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(0,0,m.size*0.7,m.size*0.7,0,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
