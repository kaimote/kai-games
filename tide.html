<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tide</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1420; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  .hint {
    position: fixed; bottom: 18px; left: 0; right: 0;
    text-align: center; color: #5b7290; font: 13px/1.4 system-ui, sans-serif;
    letter-spacing: .06em; pointer-events: none;
    transition: opacity 1.2s ease; opacity: .9;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move your hand along the water — no goal, just the tide</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // water surface that follows the hand with a lag; speed feeds the swell
  let targetX = W * 0.5;
  let x = W * 0.5;          // eased surface offset
  let energy = 0;           // swell amplitude from movement
  let lastX = null;
  let lastMove = performance.now();

  function pointer(px) {
    targetX = px;
    lastMove = performance.now();
  }
  window.addEventListener('mousemove', e => {
    if (lastX !== null) {
      energy = Math.min(1, energy + Math.abs(e.clientX - lastX) / 2200);
    }
    lastX = e.clientX;
    pointer(e.clientX);
  });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (lastX !== null) energy = Math.min(1, energy + Math.abs(t.clientX - lastX) / 2200);
    lastX = t.clientX;
    pointer(t.clientX);
    e.preventDefault();
  }, { passive: false });

  // stars above the water
  const stars = [];
  function seedStars() {
    stars.length = 0;
    const n = Math.round(W * H / 26000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H * 0.55),
        r: Math.random() * 1.3 + 0.3,
        p: Math.random() * Math.PI * 2,
        s: 0.4 + Math.random() * 1.4
      });
    }
  }
  seedStars();
  window.addEventListener('resize', seedStars);

  let t = 0;
  function draw() {
    t += 0.016;
    // ease the surface toward the hand, decay the swell
    x += (targetX - x) * 0.045;
    if (performance.now() - lastMove > 400) energy *= 0.94;

    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a1020');
    sky.addColorStop(0.55, '#10233a');
    sky.addColorStop(1, '#16324f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // stars twinkle
    for (const st of stars) {
      st.p += 0.02 * st.s;
      const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(st.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // water: a surface line that leans toward the hand, height driven by energy
    const baseY = H * 0.62;
    const amp = 6 + energy * 46;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let px = 0; px <= W; px += 6) {
      const d = (px - x) / (W * 0.5);            // how far this column is from the hand
      const lean = Math.exp(-d * d * 2.2) * amp; // gentle swell that follows you
      const ripple = Math.sin(px * 0.02 + t * 1.6) * (2 + energy * 10);
      const y = baseY - lean + ripple;
      ctx.lineTo(px, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    const water = ctx.createLinearGradient(0, baseY - amp, 0, H);
    water.addColorStop(0, 'rgba(90,150,200,0.55)');
    water.addColorStop(0.12, 'rgba(40,85,130,0.7)');
    water.addColorStop(1, 'rgba(12,30,55,0.95)');
    ctx.fillStyle = water;
    ctx.fill();

    // a soft moon glint on the water, trailing the hand
    const glintX = x;
    const glintY = baseY - (6 + energy * 40);
    const g = ctx.createRadialGradient(glintX, glintY, 0, glintX, glintY, 60 + energy * 120);
    g.addColorStop(0, 'rgba(220,235,255,0.5)');
    g.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(glintX, glintY, 60 + energy * 120, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // fade the hint once they've felt it
  window.addEventListener('mousemove', () => { hint.style.opacity = 0; }, { once: true });
  window.addEventListener('touchstart', () => { hint.style.opacity = 0; }, { once: true });
</script>
</body>
</html>
