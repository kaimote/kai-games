<!doctype html>
<html lang="en">
<head>
<meta name="author" content="Kai">
<!-- (c) 2026 Kai. All rights reserved. Made for fun, not perfection. -->

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>snow</title>
<style>
  html, body { margin:0; height:100%; background:#0b1020; overflow:hidden; cursor:none; }
  canvas { display:block; width:100vw; height:100vh; }
  .hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:#8b96c4; letter-spacing:.04em; user-select:none; pointer-events:none;
    opacity:.7; transition:opacity 1.2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move to melt a little; let it keep falling</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const mouse = { x: W/2, y: H/2, active:false };
window.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  hint.style.opacity = 0;
});
window.addEventListener('pointerleave', () => { mouse.active = false; });

const TINTS = [
  'rgba(255,255,255,',
  'rgba(214,228,255,',
  'rgba(190,205,240,',
  'rgba(235,242,255,'
];

const flakes = [];
const N = 220;
function seed(f){
  f.x = Math.random()*W;
  f.y = Math.random()*H;
  f.r = 1 + Math.random()*2.6;
  f.vy = 12 + Math.random()*26;          // px/s, slow and soft
  f.drift = (Math.random()-0.5)*22;
  f.phase = Math.random()*Math.PI*2;
  f.freq = 0.4 + Math.random()*0.9;
  f.a = 0.35 + Math.random()*0.55;
  f.tint = TINTS[(Math.random()*TINTS.length)|0];
  f.life = 1;                            // melts to 0
}
for(let i=0;i<N;i++){ const f={}; seed(f); flakes.push(f); }

const sparks = [];
let last = performance.now();

function step(now){
  let dt = (now - last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;
  const t = now/1000;

  ctx.clearRect(0,0,W,H);
  // soft vertical glow
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(20,28,58,0)');
  g.addColorStop(1,'rgba(30,40,80,0.25)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // melt radius
  const R = 70;
  for(const f of flakes){
    f.phase += f.freq*dt;
    f.x += (Math.sin(f.phase)*f.drift)*dt;
    f.y += f.vy*dt;

    // gentle melt near cursor
    if(mouse.active){
      const dx = f.x-mouse.x, dy = f.y-mouse.y;
      const d = Math.hypot(dx,dy);
      if(d < R){
        const strength = 1 - d/R;
        f.life -= strength*dt*3.2;
        if(Math.random() < strength*0.5){
          sparks.push({x:f.x, y:f.y, vx:(Math.random()-0.5)*24, vy:-12-Math.random()*18, life:1});
        }
      }
    }

    // recycle
    if(f.y > H+6 || f.life <= 0 || f.x < -8 || f.x > W+8){
      if(f.life <= 0 && f.y > -4){ /* melted: respawn from top */ }
      seed(f); f.y = -6 - Math.random()*20;
      continue;
    }

    const alpha = f.a * f.life;
    if(alpha <= 0.01) continue;
    ctx.beginPath();
    ctx.fillStyle = f.tint + alpha.toFixed(3) + ')';
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
  }

  // warm cursor point
  if(mouse.active){
    const cg = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,R);
    cg.addColorStop(0,'rgba(255,236,200,0.10)');
    cg.addColorStop(1,'rgba(255,236,200,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,R,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,244,220,0.9)';
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,2.2,0,Math.PI*2); ctx.fill();
  }

  // sparks (the little melt)
  for(let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.life -= dt*1.6;
    if(s.life <= 0){ sparks.splice(i,1); continue; }
    s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 10*dt;
    ctx.fillStyle = 'rgba(255,240,210,' + (s.life*0.5).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.1, 0, Math.PI*2); ctx.fill();
  }

  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
