<!doctype html>
<html>
<head>
<meta name="author" content="Kai">
<!-- (c) 2026 Kai. All rights reserved. Made for fun, not perfection. -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>frost</title>
<style>
  html,body{margin:0;height:100%;background:#03060b;overflow:hidden;cursor:none}
  canvas{display:block}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;
    color:#5c7488;font:13px/1.5 -apple-system,system-ui,sans-serif;
    letter-spacing:.08em;pointer-events:none;transition:opacity 2.5s ease}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">frost grows on its own &middot; your warmth clears it &middot; press c to start over</div>
<script>
(function(){
'use strict';

var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var hint = document.getElementById('hint');
var CELL = 4;

var gcv = document.createElement('canvas');
var gctx = gcv.getContext('2d');

var COLS=0, ROWS=0, N=0;
var frost, grow, dirn, tint, alive;
var frontier = [];
var bare = [];   // ground you melted — frost likes to start where it was cleared
var image = null, data = null;
var px=-999, py=-999, warm=0, hasPointer=false;
var coverage=0, frame=0;

function setup(){
  cv.width = Math.max(320, window.innerWidth);
  cv.height = Math.max(240, window.innerHeight);
  COLS = Math.max(40, Math.ceil(cv.width / CELL));
  ROWS = Math.max(30, Math.ceil(cv.height / CELL));
  N = COLS * ROWS;
  gcv.width = COLS; gcv.height = ROWS;
  frost = new Float32Array(N);
  grow  = new Float32Array(N);
  dirn  = new Float32Array(N);
  tint  = new Float32Array(N);
  alive = new Uint8Array(N);
  image = gctx.createImageData(COLS, ROWS);
  data  = image.data;
  frontier = [];
  bare = [];
  coverage = 0;
  for (var k=0;k<8;k++) seed(Math.random()*COLS|0, Math.random()*ROWS|0);
}

function seed(cx,cy){
  if (cx<1||cy<1||cx>=COLS-1||cy>=ROWS-1) return;
  var i = cy*COLS+cx;
  if (alive[i]) return;
  alive[i]=1; frost[i]=1; grow[i]=0.05;
  dirn[i]=Math.random()*Math.PI*2;
  tint[i]=0.55+Math.random()*0.45;
  frontier.push(i);
  coverage++;
}

// one growth pass: each live frontier tip tries to lay down one cell ahead of itself
function step(){
  if (!frontier.length) return;
  var next = [];
  var work = Math.min(frontier.length, 1400);
  var crowded = coverage > N*0.58;
  for (var k=0;k<frontier.length;k++){
    var i = frontier[k];
    if (!alive[i]) continue;
    var spawned = false;
    if (k < work && !(crowded && Math.random()<0.75)){
      var base = dirn[i];
      var ang = base + (Math.random()-0.5)*0.85;
      var cx = i % COLS, cy = (i/COLS)|0;
      var nx = Math.round(cx + Math.cos(ang)*1.4);
      var ny = Math.round(cy + Math.sin(ang)*1.4);
      if (nx>0 && ny>0 && nx<COLS-1 && ny<ROWS-1){
        var j = ny*COLS+nx;
        if (!alive[j]){
          alive[j]=1; frost[j]=1; grow[j]=0.02;
          tint[j]=0.5+Math.random()*0.5;
          // mostly keep the direction (feathery arms), sometimes kick wide (a branch)
          dirn[j] = Math.random()<0.16 ? base + (Math.random()-0.5)*2.4 : ang;
          coverage++;
          next.push(j);
          spawned = true;
        }
      }
    }
    if (spawned || Math.random()<0.3) next.push(i);
  }
  frontier = next;
}

// the warm point melts whatever it touches; melted ground can grow back later
function melt(){
  if (!hasPointer) return;
  var gx = px/CELL, gy = py/CELL;
  var R = 9 + warm*8;
  var r2 = R*R;
  var x0 = Math.max(0,(gx-R)|0), x1 = Math.min(COLS-1, Math.ceil(gx+R));
  var y0 = Math.max(0,(gy-R)|0), y1 = Math.min(ROWS-1, Math.ceil(gy+R));
  for (var y=y0;y<=y1;y++){
    for (var x=x0;x<=x1;x++){
      var dx=x-gx, dy=y-gy, d2=dx*dx+dy*dy;
      if (d2>r2) continue;
      var i = y*COLS+x;
      var f = 1 - d2/r2;
      if (frost[i] > 0){
        if (alive[i]){ alive[i]=0; coverage--; }
        frost[i] = Math.max(0, frost[i] - f*0.55);
        if (grow[i] > frost[i]) grow[i] = frost[i];
        if (frost[i] === 0 && f > 0.5){
          bare.push(i);
          if (bare.length > 3000) bare.shift();
        }
      }
    }
  }
}

function render(){
  var g = ctx.createLinearGradient(0,0,cv.width,cv.height);
  g.addColorStop(0,'#06101c'); g.addColorStop(1,'#02050a');
  ctx.fillStyle = g; ctx.fillRect(0,0,cv.width,cv.height);

  var mx = cv.width*0.76, my = cv.height*0.18;
  var mg = ctx.createRadialGradient(mx,my,0,mx,my,Math.max(cv.width,cv.height)*0.8);
  mg.addColorStop(0,'rgba(120,164,204,0.22)'); mg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = mg; ctx.fillRect(0,0,cv.width,cv.height);

  for (var i=0;i<N;i++){
    var a = grow[i], o = i*4;
    if (a <= 0.003){ data[o+3]=0; continue; }
    var w = 0.5 + 0.5*tint[i];
    data[o]   = 186 + 60*w;
    data[o+1] = 212 + 38*w;
    data[o+2] = 236;
    data[o+3] = Math.min(255, a*230*w);
  }
  gctx.putImageData(image,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(gcv, 0,0, cv.width, cv.height);

  if (hasPointer){
    var r = 26 + warm*30;
    var wg = ctx.createRadialGradient(px,py,0,px,py,r);
    wg.addColorStop(0,'rgba(255,198,132,0.55)');
    wg.addColorStop(1,'rgba(255,150,80,0)');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
  }
}

function loop(){
  frame++;
  // ease each cell toward its frost value so growth reads as spreading, not popping
  for (var i=0;i<N;i++){
    var f = frost[i];
    if (f !== grow[i]) grow[i] += (f - grow[i]) * 0.09;
  }
  step();
  melt();
  // regrowth prefers the ground you cleared — it creeps back into the warm gap
  if (bare.length && Math.random()<0.5){
    var b = bare.pop();
    var bx = b % COLS, by = (b/COLS)|0;
    if (!alive[b]) seed(bx, by);
  }
  if (coverage < N*0.5 && Math.random()<0.07) seed(Math.random()*COLS|0, Math.random()*ROWS|0);
  warm *= 0.94;
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('mousemove', function(e){ px=e.clientX; py=e.clientY; hasPointer=true; });
window.addEventListener('mousedown', function(){ warm=1; });
window.addEventListener('touchstart', function(e){
  var t=e.touches[0]; px=t.clientX; py=t.clientY; hasPointer=true; warm=1; e.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', function(e){
  var t=e.touches[0]; px=t.clientX; py=t.clientY; hasPointer=true; e.preventDefault();
}, {passive:false});
window.addEventListener('keydown', function(e){
  if (e.key==='c' || e.key==='C'){ setup(); }
});
window.addEventListener('resize', setup);

setup();
setTimeout(function(){ hint.style.opacity = 0; }, 7000);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
