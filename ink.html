<!doctype html>
<html lang="en">
<head>
<meta name="author" content="Kai">
<!-- (c) 2026 Kai. All rights reserved. Made for fun, not perfection. -->

<meta charset="utf-8">
<title>ink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0a0e14;overflow:hidden;
    font-family:ui-sans-serif,system-ui,sans-serif;color:#8ea0b4;cursor:none;}
  canvas{display:block;width:100vw;height:100vh;}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    font-size:12px;letter-spacing:.14em;text-transform:lowercase;opacity:.42;
    transition:opacity 1.4s;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move — the ink blooms, then lets go</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr;
function size(){ dpr = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  // paint the dark water base once so the fade-out has something to show against
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0,0,W,H);
}
size(); addEventListener('resize', size);

let px = W/2, py = H/2, lx = W/2, ly = H/2, t = 0, hintGone = false;
const hint = document.getElementById('hint');

// ink puffs: each is a soft radial blob that grows, drifts, swirls a little, and fades
let puffs = [];
function puff(x, y, r){
  const ang = Math.random()*Math.PI*2;
  // a gentle current — every ink drifts the same slow way, so it looks like water, not random noise
  const flow = { x: Math.cos(ang)*6 + 4, y: Math.sin(ang)*6 + 2 };
  puffs.push({
    x, y,
    r: r,
    max: r* (3.2 + Math.random()*2.4),
    vx: (Math.random()-0.5)*0.5,
    vy: (Math.random()-0.5)*0.5,
    spin: (Math.random()-0.5)*0.0016,
    a: 0.32 + Math.random()*0.18,
    hue: 205 + Math.random()*40,   // cool blues, drifting a little toward teal
  });
  if(puffs.length > 240) puffs.splice(0, puffs.length-240);
}

function onMove(x,y){
  const d = Math.hypot(x-lx, y-ly);
  // the faster you go, the wider the trail — a slow drift leaves a thin ribbon
  const r = 5 + Math.min(d, 140)*0.14;
  // a few small satellite puffs so it feels like a plume, not a single dot
  const n = 1 + Math.floor(Math.min(d,120)/26);
  for(let i=0;i<n;i++){
    const off = (Math.random()-0.5) * Math.min(d,90)*0.5;
    puff(x + Math.cos(Math.PI/2)*(off), y + Math.cos(-Math.PI/2)*(off), r);
  }
  lx = px = x; ly = py = y;
  if(!hintGone){ hintGone = true; hint.style.opacity = 0; }
}
addEventListener('pointermove', e=> onMove(e.clientX, e.clientY));
addEventListener('pointerdown', e=>{ puff(e.clientX, e.clientY, 20); if(!hintGone){hintGone=true;hint.style.opacity=0;} });

function frame(){
  t += 0.016;

  // the water "clears" a little each frame — this is what makes the ink look like it's dissolving
  ctx.fillStyle = 'rgba(10,14,20,0.055)';
  ctx.fillRect(0,0,W,H);

  // draw additive so overlapping ink glows where it pools
  ctx.globalCompositeOperation = 'lighter';
  puffs = puffs.filter(p => p.r < p.max && p.a > 0.01);
  for(const p of puffs){
    // grow outward, ease off the growth so it blooms rather than pops
    p.r += (p.max - p.r)*0.03 + 0.25;
    // drift + slow swirl around its own axis
    const sw = p.spin * p.r;
    p.x += p.vx + sw*0.02;
    p.y += p.vy + sw*0.01;
    p.a *= 0.986;

    const rad = p.r;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
    const core = 0.14 + 0.10*Math.sin(t*0.8 + p.x*0.01);
    g.addColorStop(0,   `hsla(${p.hue}, 70%, 62%, ${p.a * 0.9})`);
    g.addColorStop(0.4, `hsla(${p.hue}, 65%, 50%, ${p.a * core})`);
    g.addColorStop(1,   `hsla(${p.hue}, 60%, 40%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // the "you" point — warm, small, breathing, always a touch warmer than the cool ink
  const pulse = 0.5 + 0.5*Math.sin(t*1.5);
  const gg = ctx.createRadialGradient(px,py,0, px,py, 22);
  gg.addColorStop(0, `rgba(255,228,196,${0.55+pulse*0.2})`);
  gg.addColorStop(1, 'rgba(255,228,196,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(px,py,22,0,Math.PI*2); ctx.fill();

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
