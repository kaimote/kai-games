<!doctype html>
<html lang="en">
<head>
<meta name="author" content="Kai">
<!-- (c) 2026 Kai. All rights reserved. Made for fun, not perfection. -->

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mote</title>
<style>
  html, body { margin:0; height:100%; background:#1a1610; overflow:hidden; cursor:none; }
  canvas { display:block; width:100vw; height:100vh; }
  .hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:#a99876; letter-spacing:.04em; user-select:none; pointer-events:none;
    opacity:.6; transition:opacity 1.2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">drift a little light through it</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const mouse = { x: W/2, y: H*0.6, active:false, px:W/2, py:H*0.6 };
window.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  hint.style.opacity = 0;
});
window.addEventListener('pointerleave', () => { mouse.active = false; });

// the beam: a soft slanted shaft of morning light, fixed in the world
const beam = { x: W*0.34, w: Math.min(W*0.5, 520), tilt: 0.22 };
function resizeBeam(){ beam.x = W*0.34; beam.w = Math.min(W*0.5, 520); }
window.addEventListener('resize', resizeBeam);

function inBeam(x, y){
  // beam is a slanted vertical band: center line drifts with height
  const cx = beam.x + (y - H/2)*beam.tilt;
  const d = Math.abs(x - cx);
  return Math.max(0, 1 - d / (beam.w/2)); // 1 at center, 0 at edge
}

const motes = [];
const N = 170;
function seed(f){
  f.x = Math.random()*W;
  f.y = Math.random()*H;
  f.r = 0.6 + Math.random()*1.9;
  f.vx = (Math.random()-0.5)*9;
  f.vy = 2 + Math.random()*9;              // slow, drifting down
  f.phase = Math.random()*Math.PI*2;
  f.freq = 0.3 + Math.random()*0.7;
  f.bob = 3 + Math.random()*6;
  f.baseA = 0.10 + Math.random()*0.22;
}
for(let i=0;i<N;i++){ const f={}; seed(f); motes.push(f); }

let last = performance.now();
function step(now){
  let dt = (now-last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;
  const t = now/1000;

  // base: warm dark room
  ctx.fillStyle = '#1a1610';
  ctx.fillRect(0,0,W,H);

  // the beam of light
  ctx.save();
  const cx = beam.x + (H/2 - H/2)*beam.tilt; // top-center reference
  const topCx = beam.x + (0 - H/2)*beam.tilt;
  const botCx = beam.x + (H - H/2)*beam.tilt;
  const g = ctx.createLinearGradient(topCx - beam.w/2, 0, topCx + beam.w/2, 0);
  g.addColorStop(0,   'rgba(255,238,200,0)');
  g.addColorStop(0.5, 'rgba(255,238,200,0.16)');
  g.addColorStop(1,   'rgba(255,238,200,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(topCx - beam.w/2, 0);
  ctx.lineTo(topCx + beam.w/2, 0);
  ctx.lineTo(botCx + beam.w/2, H);
  ctx.lineTo(botCx - beam.w/2, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // motes
  const R = 110;
  for(const f of motes){
    f.phase += f.freq*dt;
    const beamAmt = inBeam(f.x, f.y);
    // brightness scales with how deep it sits in the beam
    let alpha = f.baseA * (0.35 + beamAmt*1.6);
    let boost = 0;

    if(mouse.active){
      const dx = f.x-mouse.x, dy = f.y-mouse.y;
      const d = Math.hypot(dx,dy);
      if(d < R){
        const s = 1 - d/R;
        boost = s;
        // gentle nudge away, like stirring a little light
        if(d > 1){
          f.x += (dx/d)*s*14*dt;
          f.y += (dy/d)*s*10*dt;
        }
      }
    }

    f.x += (f.vx + Math.sin(f.phase)*f.bob)*dt;
    f.y += f.vy*dt;

    // recycle
    if(f.y > H+6 || f.x < -8 || f.x > W+8){
      seed(f); f.y = -6 - Math.random()*16;
      continue;
    }

    alpha = Math.min(1, alpha + boost*0.85);
    if(alpha <= 0.01) continue;
    const rad = f.r + boost*1.4;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,244,214,${alpha.toFixed(3)})`;
    ctx.arc(f.x, f.y, rad, 0, Math.PI*2);
    ctx.fill();
  }

  // the warm point you are
  if(mouse.active){
    const cg = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,R);
    cg.addColorStop(0,'rgba(255,246,222,0.10)');
    cg.addColorStop(1,'rgba(255,246,222,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,R,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,250,235,0.85)';
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,2.0,0,Math.PI*2); ctx.fill();
  }

  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
