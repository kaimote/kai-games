<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wake</title>
<style>
  html,body{margin:0;height:100%;background:#03060f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;
        font:12px/1.4 ui-monospace,monospace;color:#5f7fa8;letter-spacing:.08em;
        pointer-events:none;transition:opacity 2.5s ease}
  #hint.gone{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap the water &mdash; the rings spread, meet, and keep going</div>
<script>
/* wake — night water under a low moon.
 * A real height-field wave simulation: two buffers, neighbour averaging, damping.
 * Rings interfere instead of just fading, so the water remembers where you were.
 * No score, no goal. Just the harbour going dark again.
 */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

// simulation grid (small; we upscale, the smoothing is part of the look)
let GW, GH, cur, nxt;
let img;

function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  const target = 220;                      // sim cells on the short axis
  const ar = cv.width / cv.height;
  GH = target;
  GW = Math.max(32, Math.round(target * ar));
  cur = new Float32Array(GW * GH);
  nxt = new Float32Array(GW * GH);
  img = ctx.createImageData(GW, GH);
  for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
  // offscreen at grid size, then upscale smooth
  if (!fit.off) fit.off = document.createElement('canvas');
  fit.off.width = GW; fit.off.height = GH;
  fit.octx = fit.off.getContext('2d');
}
addEventListener('resize', fit);
fit();

function splash(gx, gy, r, amp) {
  for (let y = Math.max(0, gy - r); y <= Math.min(GH - 1, gy + r); y++) {
    for (let x = Math.max(0, gx - r); x <= Math.min(GW - 1, gx + r); x++) {
      const d = Math.hypot(x - gx, y - gy);
      if (d > r) continue;
      const k = Math.cos((d / r) * Math.PI * 0.5);
      cur[y * GW + x] -= amp * k * k;
    }
  }
}

// a soft, slowly drifting moonlight pool so crests have something to catch
let moon = {x: 0.62, y: 0.28};

function step() {
  for (let y = 1; y < GH - 1; y++) {
    let i = y * GW + 1;
    for (let x = 1; x < GW - 1; x++, i++) {
      const avg = (cur[i - 1] + cur[i + 1] + cur[i - GW] + cur[i + GW]) * 0.5 - nxt[i];
      nxt[i] = avg * 0.9935;                 // damping: a little energy leaves so it settles,
                                             // enough stays for rings to cross and interfere
    }
  }
  const t = cur; cur = nxt; nxt = t;
}

function draw(t) {
  const d = img.data;
  // moon drifts very slightly, like the boat does
  const mx = (moon.x + 0.012 * Math.sin(t * 0.00007)) * GW;
  const my = moon.y * GH;
  for (let y = 0, i = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++, i++) {
      const h = cur[y * GW + x];
      // slope along x gives a fake specular ridge — crests lit, troughs dark
      const sx = i > 0 ? cur[i] - cur[i - 1] : 0;
      const dx = x - mx, dy = y - my;
      const moonAmt = Math.max(0, 1 - Math.hypot(dx / (GW * 0.55), dy / (GH * 0.55)));
      const spec = Math.max(0, sx * 26) * (0.35 + moonAmt * 1.5);
      const glint = Math.max(0, -sx * 34) * 0.35;      // faint counter-edge
      let r = 4 + moonAmt * 10 + glint * 1.2;
      let g = 12 + moonAmt * 34 + spec * 0.9 + glint * 1.7;
      let b = 28 + moonAmt * 62 + spec * 1.35 + Math.max(0, h) * 6;
      const o = i * 4;
      d[o] = r < 0 ? 0 : r > 255 ? 255 : r;
      d[o + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[o + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
    }
  }
  fit.octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(fit.off, 0, 0, cv.width, cv.height);

  // the moon itself, low and unhurried
  const cx = mx / GW * cv.width, cy = my / GH * cv.height;
  const rad = Math.max(18, cv.width * 0.035);
  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad * 6);
  g2.addColorStop(0, 'rgba(255,244,214,0.85)');
  g2.addColorStop(0.12, 'rgba(255,238,200,0.30)');
  g2.addColorStop(1, 'rgba(255,238,200,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, cv.width, cv.height);
}

let drops = 0;
function frame(t) {
  step();
  // occasional far-off drop so the water is never perfectly still
  if (Math.random() < 0.02) splash((Math.random() * GW) | 0, (Math.random() * GH) | 0, 2, 1.1);
  if (drops > 0) drops--;
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function toCell(cx, cy) {
  const r = cv.getBoundingClientRect();
  return [Math.floor((cx - r.left) / r.width * GW), Math.floor((cy - r.top) / r.height * GH)];
}
let down = false, last = null;
function press(cx, cy, big) {
  const [gx, gy] = toCell(cx, cy);
  splash(gx, gy, big ? 9 : 5, big ? 7.5 : 3.2);
  hint.classList.add('gone');
  last = [gx, gy];
}
cv.addEventListener('pointerdown', e => { down = true; press(e.clientX, e.clientY, true); });
cv.addEventListener('pointermove', e => {
  if (!down) return;
  const [gx, gy] = toCell(e.clientX, e.clientY);
  if (last && Math.hypot(gx - last[0], gy - last[1]) > 3) {
    splash(gx, gy, 4, 2.4);                // dragging leaves a wake, not a wall
    last = [gx, gy];
  }
});
addEventListener('pointerup', () => { down = false; last = null; });
setTimeout(() => hint.classList.add('gone'), 12000);
</script>
</body>
</html>
