<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>koi</title>
<style>
  html, body { margin:0; height:100%; background:#08110f; overflow:hidden; cursor:none; }
  canvas { display:block; width:100vw; height:100vh; }
  .hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:#7fae9c; letter-spacing:.04em; user-select:none; pointer-events:none;
    opacity:.7; transition:opacity 1.4s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move — the koi are curious</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#08110f'; ctx.fillRect(0,0,W,H);
}
window.addEventListener('resize', resize);
resize();

const mouse = { x: W/2, y: H/2, active:false };
window.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  hint.style.opacity = 0;
});
window.addEventListener('pointerleave', () => { mouse.active = false; });

// a koi = soft body, a head, a tail that lags behind
const koi = [];
const N = 6;
const PALETTE = [
  { body:'#f3e9d6', spot:'#d97757' },   // cream + orange patch
  { body:'#e9d9c2', spot:'#c96a48' },
  { body:'#d8e2d8', spot:'#7f9e7a' },   // pale + green patch
  { body:'#efe6cf', spot:'#b8763f' },
  { body:'#f2efe6', spot:'#c96a48' },
  { body:'#e7ddc8', spot:'#8a9c7a' },
];
for (let i=0;i<N;i++){
  koi.push({
    x: Math.random()*W, y: Math.random()*H,
    vx:(Math.random()*2-1)*20, vy:(Math.random()*2-1)*20,
    ang: Math.random()*Math.PI*2,
    len: 22 + Math.random()*16,          // body length
    w: 7 + Math.random()*5,              // half-width
    speed: 12 + Math.random()*10,
    wander: Math.random()*Math.PI*2,
    tail: 0,                              // tail phase
    pal: PALETTE[i % PALETTE.length],
    spotX: (Math.random()*2-1)*0.35,     // patch position along body (-1..1)
    spotR: 0.4 + Math.random()*0.25,
  });
}

let last = performance.now();
function step(now){
  let dt = (now - last)/1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const t = now/1000;

  // water: slow dark green trail
  ctx.fillStyle = 'rgba(8,17,15,0.5)';
  ctx.fillRect(0,0,W,H);

  // a faint ripple where your point sits (like a finger on the water)
  if (mouse.active){
    const g = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,60);
    g.addColorStop(0,'rgba(180,220,205,0.10)');
    g.addColorStop(1,'rgba(180,220,205,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,60,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(230,255,245,0.85)';
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,2.2,0,Math.PI*2); ctx.fill();
  }

  for (const k of koi){
    // steering: gentle wander + mild interest in your point
    k.wander += (Math.random()*2-1) * 0.4 * dt * 10;
    let ax = Math.cos(k.wander) * 6;
    let ay = Math.sin(k.wander) * 6;

    if (mouse.active){
      const dx = mouse.x - k.x, dy = mouse.y - k.y;
      const d = Math.hypot(dx,dy) || 1;
      // curious within a radius, but not crowding — a gentle pull
      if (d < 180) {
        const pull = (180 - d) / 180;
        ax += (dx/d) * 22 * pull;
        ay += (dy/d) * 22 * pull;
      }
    }

    k.vx += ax*dt; k.vy += ay*dt;
    // damping
    k.vx *= (1 - dt*0.9); k.vy *= (1 - dt*0.9);
    // cap speed
    const sp = Math.hypot(k.vx,k.vy);
    if (sp > k.speed){ k.vx = k.vx/sp*k.speed; k.vy = k.vy/sp*k.speed; }
    if (sp < 4){ // keep a minimum drift so they always swim
      k.vx += Math.cos(k.ang)*4*dt; k.vy += Math.sin(k.ang)*4*dt;
    }

    k.x += k.vx*dt; k.y += k.vy*dt;
    // soft edge: steer back toward center near the walls
    const m = 60;
    if (k.x < m) k.vx += (m-k.x)*0.4*dt;
    if (k.x > W-m) k.vx -= (k.x-(W-m))*0.4*dt;
    if (k.y < m) k.vy += (m-k.y)*0.4*dt;
    if (k.y > H-m) k.vy -= (k.y-(H-m))*0.4*dt;
    if (k.x < 4) k.x = 4; if (k.x > W-4) k.x = W-4;
    if (k.y < 4) k.y = 4; if (k.y > H-4) k.y = H-4;

    // heading eases toward velocity
    const target = Math.atan2(k.vy,k.vx);
    let da = target - k.ang;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    k.ang += da * Math.min(1, dt*4);
    k.tail += dt * (6 + sp*0.25);

    // ---- draw: tail first (behind), then body, then patch, then head ----
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.ang);

    const L = k.len, hw = k.w;
    const tailWag = Math.sin(k.tail) * 0.5;

    // tail fin (behind, -L/2)
    const tailX = -L/2;
    ctx.fillStyle = k.pal.body;
    ctx.beginPath();
    ctx.moveTo(tailX, 0);
    ctx.lineTo(tailX - 10, -hw*0.9 + tailWag*6);
    ctx.lineTo(tailX - 10,  hw*0.9 + tailWag*6);
    ctx.closePath();
    ctx.fill();

    // body: a soft oval
    ctx.fillStyle = k.pal.body;
    ctx.beginPath();
    ctx.ellipse(0, 0, L/2, hw, 0, 0, Math.PI*2);
    ctx.fill();

    // a soft top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, -hw*0.28, L/2*0.85, hw*0.34, 0, 0, Math.PI*2);
    ctx.fill();

    // colored patch (koi marking)
    const px = k.spotX * L;
    ctx.fillStyle = k.pal.spot;
    ctx.beginPath();
    ctx.ellipse(px, 0, L*0.16*k.spotR + 5, hw*0.8, 0, 0, Math.PI*2);
    ctx.fill();

    // two small pectoral fins
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    const finWag = Math.sin(k.tail*0.7)*0.3;
    ctx.beginPath();
    ctx.ellipse(L*0.05,  hw*0.7, L*0.10, hw*0.4, 0.6+finWag, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(L*0.05, -hw*0.7, L*0.10, hw*0.4, -0.6-finWag, 0, Math.PI*2);
    ctx.fill();

    // eyes (two dark dots near the head, +L/2 side)
    ctx.fillStyle = 'rgba(30,25,20,0.55)';
    const ex = L/2 - 3;
    ctx.beginPath(); ctx.arc(ex, -hw*0.35, 1.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex,  hw*0.35, 1.1, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
