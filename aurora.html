<!doctype html>
<html lang="en">
<head>
<meta name="author" content="Kai">
<!-- (c) 2026 Kai. All rights reserved. Made for fun, not perfection. -->

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aurora</title>
<style>
  html, body { margin:0; height:100%; background:#070b16; overflow:hidden; cursor:none; }
  canvas { display:block; width:100vw; height:100vh; }
  .hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:#8ea6c8; letter-spacing:.04em; user-select:none; pointer-events:none;
    opacity:.6; transition:opacity 1.2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">drag a ribbon of light across the sky</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// stars (fixed, faint, some twinkle)
const stars = [];
function seedStars(){
  stars.length = 0;
  const n = Math.round((W*H)/9000);
  for(let i=0;i<n;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.85,
      r: 0.4 + Math.random()*1.1,
      base: 0.15 + Math.random()*0.5,
      ph: Math.random()*Math.PI*2,
      fr: 0.2 + Math.random()*0.8
    });
  }
}
seedStars();
window.addEventListener('resize', seedStars);

// the ribbon: a fading trail of points left where the warm point goes
const trail = [];
const TMAX = 90;
const mouse = { x: W/2, y: H*0.5, active:false, px:W/2, py:H*0.5, down:false };
window.addEventListener('pointermove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  hint.style.opacity = 0;
});
window.addEventListener('pointerleave', () => { mouse.active = false; });
window.addEventListener('pointerdown', () => { mouse.down = true; });
window.addEventListener('pointerup',   () => { mouse.down = false; });

let last = performance.now();
function step(now){
  let dt = (now-last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;
  const t = now/1000;

  // night sky gradient
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,   '#05070f');
  sky.addColorStop(0.6, '#0a1020');
  sky.addColorStop(1,   '#0d1830');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // stars
  for(const s of stars){
    s.ph += s.fr*dt;
    const a = s.base * (0.6 + 0.4*Math.sin(s.ph));
    ctx.fillStyle = `rgba(210,225,255,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }

  // faint drifting aurora bands in the background
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let b=0;b<2;b++){
    const baseY = H*(0.28 + b*0.16);
    const amp = 40 + b*20;
    ctx.beginPath();
    for(let x=0;x<=W;x+=18){
      const y = baseY
        + Math.sin(x*0.006 + t*(0.25+b*0.12) + b*2.0)*amp
        + Math.sin(x*0.0021 - t*0.18)*amp*0.6;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    const col = b===0 ? 'rgba(70,210,170,' : 'rgba(110,150,235,';
    ctx.lineWidth = 40 + b*30;
    ctx.strokeStyle = col + '0.05)';
    ctx.stroke();
  }
  ctx.restore();

  // record a new ribbon point if moving
  if(mouse.active){
    const moved = Math.hypot(mouse.x-mouse.px, mouse.y-mouse.py);
    if(moved > 1.2 || trail.length === 0){
      trail.push({ x: mouse.x, y: mouse.y, a: 1, w: 1 + moved*0.06 });
      if(trail.length > TMAX) trail.shift();
    }
  }

  // draw the ribbon as a soft tapering glow, fading from the tail
  if(trail.length > 1){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for(let i=1;i<trail.length;i++){
      const p0 = trail[i-1], p1 = trail[i];
      const life = i/trail.length;          // 0 = tail, 1 = head
      const fade = life*life;
      const w = Math.max(0.5, p1.w*0.6*fade);
      const a = 0.5*fade;
      // cool -> warm hue along the ribbon
      const r = Math.round(120 + 135*life);
      const g = Math.round(200 - 20*life);
      const b = Math.round(235 - 40*life);
      ctx.strokeStyle = `rgba(${r},${g},${b},${a.toFixed(3)})`;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y);
      ctx.stroke();
    }
    ctx.restore();
    // decay
    for(const p of trail) p.a = Math.max(0, p.a - dt*0.9);
    while(trail.length && trail[0].a <= 0.01) trail.shift();
  }

  // the warm point you are
  if(mouse.active){
    const R = 70;
    const cg = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,R);
    cg.addColorStop(0,'rgba(255,247,224,0.16)');
    cg.addColorStop(1,'rgba(255,247,224,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,R,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,251,238,0.9)';
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,2.2,0,Math.PI*2); ctx.fill();
  }

  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
