<!doctype html>
<html>
<head>
<meta name="author" content="Kai">

<meta charset="utf-8">
<title>hearth</title>
<style>
  html, body { margin:0; height:100%; background:#0a0806; overflow:hidden; cursor:none; }
  canvas { display:block; }
  .hint {
    position:fixed; bottom:18px; left:0; right:0;
    text-align:center; color:rgba(255,255,255,.24);
    font:12px/1 -apple-system, system-ui, sans-serif;
    letter-spacing:.12em; text-transform:lowercase;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">tap to feed the fire · let it rest when you like</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, CX, BASE;
function resize(){
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  CX = W/2;
  BASE = H * 0.72;         // where the logs sit
}
addEventListener('resize', resize); resize();

// ---- fire state ----
let heat = 0.55;          // 0 (cold coals) .. 1 (blazing)
const HEAT_MAX = 1;
const FEED = 0.42;        // heat added per tap
const DECAY = 0.10;       // per second

const flames = [];        // rising flame particles
const embers = [];        // drifting sparks
const coals = [];         // the glowing pile (static, brightness = heat)

function seedCoals(){
  coals.length = 0;
  for (let i = 0; i < 9; i++){
    coals.push({
      x: CX + (Math.random()*2 - 1) * 46,
      y: BASE + (Math.random()*2 - 1) * 10,
      r: 4 + Math.random() * 5,
      ph: Math.random() * Math.PI * 2
    });
  }
}
seedCoals();

function feed(){
  heat = Math.min(HEAT_MAX, heat + FEED);
  // burst of flame particles
  const n = 10 + (Math.random()*6|0);
  for (let i = 0; i < n; i++){
    flames.push({
      x: CX + (Math.random()*2 - 1) * 26,
      y: BASE - Math.random()*8,
      vx: (Math.random()*2 - 1) * 8,
      vy: -40 - Math.random()*70,
      life: 0.5 + Math.random()*0.6,
      age: 0,
      size: 7 + Math.random()*10,
      hue: 20 + Math.random()*22
    });
  }
}

// input
function tap(x, y){ feed(); }
addEventListener('mousedown', e => tap(e.clientX, e.clientY));
addEventListener('touchstart', e => { const t=e.touches[0]; tap(t.clientX, t.clientY); }, {passive:true});

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // heat decay
  heat = Math.max(0, heat - DECAY * dt);

  // clear with a slow warm trail
  ctx.fillStyle = 'rgba(10,8,6,0.35)';
  ctx.fillRect(0, 0, W, H);

  const h = heat; // 0..1

  // ---- coals (the base glow) ----
  for (const c of coals){
    const tw = 0.6 + 0.4 * Math.sin(now/700 + c.ph);
    const b = 0.12 + h * 0.85;
    const r = c.r * (1 + 0.25 * tw);
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r*2.4);
    g.addColorStop(0, `hsla(${12 + 18*h}, 95%, ${38 + 30*h}%, ${0.9*b})`);
    g.addColorStop(0.6, `hsla(18, 90%, ${30 + 20*h}%, ${0.4*b})`);
    g.addColorStop(1, 'hsla(10, 80%, 20%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r*2.4, 0, Math.PI*2);
    ctx.fill();
  }

  // ambient light pool on the "ground"
  if (h > 0.02){
    const pool = ctx.createRadialGradient(CX, BASE+8, 0, CX, BASE+8, 120 + 160*h);
    pool.addColorStop(0, `hsla(28, 90%, 50%, ${0.18*h})`);
    pool.addColorStop(1, 'hsla(28, 90%, 40%, 0)');
    ctx.fillStyle = pool;
    ctx.beginPath();
    ctx.arc(CX, BASE+8, 120 + 160*h, 0, Math.PI*2);
    ctx.fill();
  }

  // spawn steady flame while hot
  const rate = Math.floor(h * 6 * (dt*60));
  for (let i = 0; i < rate; i++){
    if (Math.random() < h){
      flames.push({
        x: CX + (Math.random()*2 - 1) * (14 + 18*(1-h)),
        y: BASE - Math.random()*6,
        vx: (Math.random()*2 - 1) * (6 + 10*(1-h)),
        vy: -55 - Math.random()*70*h,
        life: 0.45 + Math.random()*0.55,
        age: 0,
        size: 6 + Math.random()*9,
        hue: 22 + Math.random()*20
      });
    }
  }

  // update + draw flames
  for (let i = flames.length-1; i >= 0; i--){
    const f = flames[i];
    f.age += dt;
    if (f.age >= f.life){ flames.splice(i,1); continue; }
    f.x += f.vx*dt;
    f.y += f.vy*dt;
    f.vy -= 30*dt;           // accelerate upward
    f.vx += (Math.random()*2-1) * 30 * dt; // flicker
    const t = 1 - f.age/f.life;
    const r = f.size * (0.4 + 0.9*t);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    const l = 55 + 25*t;
    g.addColorStop(0, `hsla(${f.hue}, 100%, ${l}%, ${0.9*t})`);
    g.addColorStop(0.5, `hsla(${f.hue-6}, 100%, ${l-20}%, ${0.5*t})`);
    g.addColorStop(1, `hsla(${f.hue-12}, 95%, 30%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, Math.PI*2);
    ctx.fill();

    // occasionally throw an ember up from a flame tip
    if (t > 0.7 && Math.random() < 0.15){
      embers.push({ x:f.x, y:f.y, vx:(Math.random()*2-1)*22, vy:-30-Math.random()*40,
                    age:0, life:1.4+Math.random()*1.6, hue:f.hue });
    }
  }

  // update + draw embers
  for (let i = embers.length-1; i >= 0; i--){
    const e = embers[i];
    e.age += dt;
    if (e.age >= e.life){ embers.splice(i,1); continue; }
    e.x += e.vx*dt;
    e.y += e.vy*dt;
    e.vy += 8*dt;            // slight gravity so they arc and fall
    e.vx += (Math.random()*2-1) * 12 * dt;
    const t = 1 - e.age/e.life;
    ctx.fillStyle = `hsla(${e.hue+10}, 100%, ${60+20*t}%, ${0.85*t})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 1 + 1.6*t, 0, Math.PI*2);
    ctx.fill();
  }

  // faint cursor ember when the pointer is over the fire area
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
