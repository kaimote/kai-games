<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>lantern</title>
<style>
  html,body{margin:0;height:100%;background:#0c1018;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8e2d4;}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none;}
  #hud{position:fixed;top:14px;left:0;right:0;text-align:center;pointer-events:none;user-select:none;}
  #score{font-size:26px;font-weight:600;letter-spacing:.5px;}
  #sub{font-size:12px;opacity:.55;margin-top:3px;}
  #msg{position:fixed;left:0;right:0;bottom:16%;text-align:center;pointer-events:none;user-select:none;}
  #msg .big{font-size:34px;font-weight:700;}
  #msg .hint{font-size:13px;opacity:.6;margin-top:8px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="sub">time 0:00</div></div>
<div id="msg"><div class="big">lantern</div><div class="hint">move to gather the fireflies &middot; click to begin</div></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
const subEl = document.getElementById('sub');
const msgEl = document.getElementById('msg');

let W=0, H=0, dpr=1;
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize); resize();

// lantern follows pointer / arrows
const lantern = { x: W/2, y: H*0.7, r: 26, vx:0, vy:0 };
const keys = {left:false,right:false,up:false,down:false};
let pointer = { x:W/2, y:H*0.7, active:false };

let flies = [];       // {x,y,vx,vy,phase,caught,r}
let sparks = [];       // burst particles
let score = 0;
let running = false;
let startT = 0;
const ROUND = 60;      // seconds

function spawnFly(){
  const fromTop = Math.random() < 0.7;
  const x = Math.random()*W;
  const y = fromTop ? -10 : Math.random()*H*0.5;
  flies.push({
    x, y,
    vx:(Math.random()-0.5)*0.35,
    vy:0.25 + Math.random()*0.5,
    phase: Math.random()*Math.PI*2,
    r: 2.5 + Math.random()*2.2,
    caught:false
  });
}

function reset(){
  flies=[]; sparks=[]; score=0;
  lantern.x = W/2; lantern.y = H*0.7;
  for(let i=0;i<6;i++){ spawnFly(); }
  scoreEl.textContent='0';
  running=true; startT=performance.now();
  msgEl.style.opacity=0;
}

function burst(x,y){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*2.4;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1});
  }
}

function step(dt){
  // lantern movement: blend pointer target with arrow velocity
  if(keys.left)  lantern.x -= 340*dt;
  if(keys.right) lantern.x += 340*dt;
  if(keys.up)    lantern.y -= 340*dt;
  if(keys.down)  lantern.y += 340*dt;

  if(pointer.active){
    lantern.x += (pointer.x - lantern.x) * Math.min(1, 10*dt);
    lantern.y += (pointer.y - lantern.y) * Math.min(1, 10*dt);
  }
  lantern.x = Math.max(lantern.r, Math.min(W-lantern.r, lantern.x));
  lantern.y = Math.max(lantern.r, Math.min(H-lantern.r, lantern.y));

  // spawn rate ramps slightly over the round
  const t = (performance.now()-startT)/1000;
  if(Math.random() < 0.06 + t*0.0009) spawnFly();

  for(const f of flies){
    f.phase += dt*3;
    f.x += f.vx + Math.sin(f.phase)*0.35;
    f.y += f.vy;
    const dx=f.x-lantern.x, dy=f.y-lantern.y;
    const d=Math.hypot(dx,dy);
    if(!f.caught && d < lantern.r+8){
      f.caught=true; score++; scoreEl.textContent=score;
      burst(f.x,f.y);
    }
  }
  flies = flies.filter(f=> !f.caught && f.y < H+20 && f.x>-20 && f.x<W+20);

  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=dt*1.6; }
  sparks = sparks.filter(s=>s.life>0);

  // time
  const remain = Math.max(0, ROUND - t);
  const mm = Math.floor(remain/60), ss = Math.floor(remain%60);
  subEl.textContent = 'time ' + mm + ':' + String(ss).padStart(2,'0');

  if(remain<=0){
    running=false;
    msgEl.style.opacity=1;
    msgEl.querySelector('.big').textContent = 'lit ' + score;
    msgEl.querySelector('.hint').textContent = 'click to light again';
  }
}

function draw(){
  // background glow follows lantern
  ctx.fillStyle = '#0c1018';
  ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(lantern.x,lantern.y,4,lantern.x,lantern.y,Math.max(W,H)*0.55);
  g.addColorStop(0,'rgba(255,196,120,0.18)');
  g.addColorStop(1,'rgba(255,196,120,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // fireflies
  for(const f of flies){
    const tw = 0.6 + 0.4*Math.sin(f.phase*2);
    ctx.beginPath();
    ctx.fillStyle='rgba(214,255,180,'+(0.35+0.55*tw)+')';
    ctx.shadowColor='rgba(190,255,150,0.9)'; ctx.shadowBlur=10;
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;

  // sparks
  for(const s of sparks){
    ctx.beginPath();
    ctx.fillStyle='rgba(255,220,150,'+Math.max(0,s.life)+')';
    ctx.arc(s.x,s.y,1.6*s.life+0.6,0,Math.PI*2); ctx.fill();
  }

  // lantern
  ctx.beginPath();
  ctx.fillStyle='rgba(255,205,130,0.95)';
  ctx.shadowColor='rgba(255,190,110,1)'; ctx.shadowBlur=24;
  ctx.arc(lantern.x,lantern.y,lantern.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.arc(lantern.x,lantern.y,lantern.r*0.45,0,Math.PI*2); ctx.fill();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(running) step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// input
cv.addEventListener('pointermove', e=>{ pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true; });
cv.addEventListener('pointerdown', e=>{
  if(!running){ reset(); }
  pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true;
});
window.addEventListener('keydown', e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') keys.left=true;
  if(k==='ArrowRight'||k==='d') keys.right=true;
  if(k==='ArrowUp'||k==='w') keys.up=true;
  if(k==='ArrowDown'||k==='s') keys.down=true;
  if((k===' '||k==='Enter'||k==='r') && !running) reset();
});
window.addEventListener('keyup', e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') keys.left=false;
  if(k==='ArrowRight'||k==='d') keys.right=false;
  if(k==='ArrowUp'||k==='w') keys.up=false;
  if(k==='ArrowDown'||k==='s') keys.down=false;
});
</script>
</body>
</html>
