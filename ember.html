<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ember</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0a0c; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hint {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    color: rgba(255,200,150,0.25); font: 300 13px system-ui; pointer-events: none;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">tap / click anywhere</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const embers = [];
let hintShown = true;

function spawn(x, y) {
  if (hintShown) { document.getElementById('hint').style.opacity = '0'; hintShown = false; }
  const count = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    embers.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -(0.6 + Math.random() * 1.2),
      r: 1.5 + Math.random() * 3,
      life: 1,
      decay: 0.004 + Math.random() * 0.006,
      hue: 15 + Math.random() * 30,
      flicker: Math.random() * Math.PI * 2
    });
  }
}

c.addEventListener('pointerdown', e => {
  const r = c.getBoundingClientRect();
  spawn(e.clientX - r.left, e.clientY - r.top);
});

let t = 0;
function frame() {
  t += 0.016;
  ctx.clearRect(0, 0, W, H);

  // subtle warm glow at bottom
  const grad = ctx.createLinearGradient(0, H, 0, H - 120);
  grad.addColorStop(0, 'rgba(40, 18, 5, 0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H - 120, W, 120);

  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx + Math.sin(t * 2 + e.flicker) * 0.15;
    e.y += e.vy;
    e.life -= e.decay;

    if (e.life <= 0) { embers.splice(i, 1); continue; }

    const alpha = e.life * (0.6 + 0.4 * Math.sin(t * 8 + e.flicker));
    const r = e.r * (0.5 + e.life * 0.5);

    // glow
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r * 4);
    g.addColorStop(0, `hsla(${e.hue}, 90%, 60%, ${alpha * 0.3})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r * 4, 0, Math.PI * 2);
    ctx.fill();

    // core
    ctx.fillStyle = `hsla(${e.hue + 10}, 95%, ${70 + e.life * 20}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
