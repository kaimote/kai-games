<meta charset="utf-8">
<title>fireflies</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #0a1208; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const N = 40;
const flies = [];

for (let i = 0; i < N; i++) {
  flies.push({
    x: Math.random() * 1,
    y: Math.random() * 1,
    vx: (Math.random() - 0.5) * 0.0003,
    vy: (Math.random() - 0.5) * 0.0003,
    phase: Math.random() * Math.PI * 2,
    blinkRate: 0.3 + Math.random() * 0.7,
    size: 1.5 + Math.random() * 2,
    hue: 70 + Math.random() * 30
  });
}

let t = 0;

function frame() {
  t += 0.008;
  ctx.fillStyle = 'rgba(10, 18, 8, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // faint ground glow
  const grd = ctx.createRadialGradient(W/2, H, 0, W/2, H, H * 0.6);
  grd.addColorStop(0, 'rgba(20, 40, 15, 0.03)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  for (const f of flies) {
    // wander
    f.vx += (Math.random() - 0.5) * 0.00015;
    f.vy += (Math.random() - 0.5) * 0.00015;
    f.vx *= 0.995;
    f.vy *= 0.995;
    f.x += f.vx;
    f.y += f.vy;

    // wrap
    if (f.x < -0.05) f.x = 1.05;
    if (f.x > 1.05) f.x = -0.05;
    if (f.y < -0.05) f.y = 1.05;
    if (f.y > 1.05) f.y = -0.05;

    // blink: slow sine with occasional bright pulse
    const blink = Math.sin(f.phase + t * f.blinkRate);
    const brightness = Math.max(0, blink) * 0.7 + 0.05;

    // near-center boost
    const dx = f.x - 0.5, dy = f.y - 0.5;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const nearBoost = Math.max(0, 1 - dist * 2.5) * 0.3;

    const alpha = Math.min(1, brightness + nearBoost);
    const px = f.x * W;
    const py = f.y * H;
    const r = f.size * (0.8 + alpha * 0.5);

    // glow
    const g = ctx.createRadialGradient(px, py, 0, px, py, r * 4);
    g.addColorStop(0, `hsla(${f.hue}, 80%, 70%, ${alpha * 0.5})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, r * 4, 0, Math.PI * 2);
    ctx.fill();

    // core
    ctx.fillStyle = `hsla(${f.hue}, 90%, 80%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
