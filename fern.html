<!doctype html>
<html>
<head>
<meta name="author" content="Kai">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fern</title>
<style>
  html,body{margin:0;height:100%;background:#04070a;overflow:hidden;
    font:-apple-system,system-ui,"Segoe UI",sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  .hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#2f4351;
    pointer-events:none;transition:opacity 2s ease}
  .hint.gone{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">hold and move slowly &middot; hurry and it browns</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#04070a'; ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- state -------------------------------------------------------------
  const MAX_FRONDS = 9;
  const fronds = [];
  const MAX_SPEED = 2.4;          // px/frame. faster than this and growth stalls.
  let pointer = { x: W * 0.5, y: H * 0.6, down: false, has: false };
  let hintShown = true;

  function newFrond(x, y, ang) {
    return {
      pts: [{ x, y }],
      leaflets: [],
      ang: ang,
      len: 0,
      grow: 1,          // 1 = fresh green, decays toward brown
      stress: 0,        // 0..1, how hurried it is
      born: performance.now(),
      fading: 0,        // 0 = solid, ->1 gone
      done: false,
    };
  }

  function oldestVisible() {
    let idx = -1, best = Infinity;
    for (let i = 0; i < fronds.length; i++) {
      if (fronds[i].fading === 0 && !fronds[i].done) continue;
      if (fronds[i].born < best) { best = fronds[i].born; idx = i; }
    }
    return idx;
  }

  // ---- input -------------------------------------------------------------
  function setPos(e) {
    const t = e.touches ? e.touches[0] : e;
    pointer.x = t.clientX; pointer.y = t.clientY; pointer.has = true;
  }
  cv.addEventListener('pointermove', setPos);
  cv.addEventListener('pointerdown', (e) => {
    setPos(e); pointer.down = true;
    if (hintShown) { hint.classList.add('gone'); hintShown = false; }
    if (!current()) {
      if (fronds.filter(f => f.fading === 0).length >= MAX_FRONDS) {
        const i = oldestVisible();
        if (i >= 0) fronds[i].fading = 0.0001;
      }
      const from = fronds.length ? fronds[fronds.length - 1] : null;
      const ang = from && !from.done
        ? from.ang
        : -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      fronds.push(newFrond(pointer.x, pointer.y, ang));
    }
  });
  window.addEventListener('pointerup', () => {
    pointer.down = false;
    const f = current();
    if (f) f.done = true;
  });
  window.addEventListener('pointercancel', () => { pointer.down = false; });

  function current() {
    for (let i = fronds.length - 1; i >= 0; i--) {
      if (fronds[i].fading === 0 && !fronds[i].done) return fronds[i];
    }
    return null;
  }

  // ---- growth ------------------------------------------------------------
  function grow(dt) {
    const f = current();
    if (!f || !pointer.has) return;
    const head = f.pts[f.pts.length - 1];
    const dx = pointer.x - head.x, dy = pointer.y - head.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.05) return;

    // chase, capped at MAX_SPEED. overspeed registers as stress.
    const step = Math.min(d * 0.22, MAX_SPEED);
    const over = Math.max(0, (d * 0.22) / MAX_SPEED - 1);
    f.stress = Math.min(1, f.stress * 0.94 + over * 0.16);

    let ang = Math.atan2(dy, dx);
    let diff = ang - f.ang;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    f.ang += diff * 0.14;                       // gentle, stem-like lag
    f.ang += -0.010 * Math.cos(f.ang);          // leans up
    if (f.pts.length > 20) f.ang += Math.sin(f.len * 0.045) * 0.012;

    const nx = head.x + Math.cos(f.ang) * step;
    const ny = head.y + Math.sin(f.ang) * step;
    f.pts.push({ x: nx, y: ny });
    f.len += step;

    // leaflets sprout along the stem, more thickly toward the tip
    if (f.pts.length % 4 === 0 && f.pts.length > 6) {
      const t = f.pts.length / 160;
      const size = 5 + 16 * (1 - Math.min(1, t)) * (0.6 + Math.random() * 0.6);
      const side = Math.random() < 0.5 ? -1 : 1;
      f.leaflets.push({
        i: f.pts.length - 1, side, size,
        open: 0,                                        // 0 furled -> 1 unfurled
        curl: (Math.random() * 0.5 + 0.25) * side,
      });
    }
  }

  // ---- draw --------------------------------------------------------------
  function leaflet(f, lf) {
    const p = f.pts[lf.i]; if (!p) return;
    const q = f.pts[Math.max(0, lf.i - 1)];
    const base = Math.atan2(p.y - q.y, p.x - q.x) + lf.side * Math.PI * 0.42;
    const o = lf.open;
    const L = lf.size * (0.35 + 0.65 * o);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(base + lf.curl * (1 - o) * 1.7);
    // unfurling crozier: a tight spiral that opens into a leaflet
    ctx.beginPath();
    const segs = 14;
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const a = u * (1.1 + 2.4 * (1 - o)) * lf.side;
      const r = L * u;
      const x = Math.cos(a - Math.PI / 2) * r * (0.5 + 0.5 * o);
      const y = r;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    const g = 96 - 46 * Math.min(1, f.stress);
    const rr = 60 + 90 * Math.min(1, f.stress);
    ctx.strokeStyle = `rgba(${rr | 0},${g | 0},70,${0.55 * o + 0.08})`;
    ctx.lineWidth = 1.1 + 0.9 * o;
    ctx.stroke();
    // pinnae — tiny ticks down the leaflet spine, only once it's open
    if (o > 0.35) {
      ctx.strokeStyle = `rgba(${(rr + 24) | 0},${(g + 26) | 0},84,${0.32 * o})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      for (let s = 2; s <= segs - 2; s += 2) {
        const u = s / segs;
        const a = u * (1.1 + 2.4 * (1 - o)) * lf.side;
        const r = L * u;
        const x = Math.cos(a - Math.PI / 2) * r * (0.5 + 0.5 * o);
        const y = r;
        const w = 3.2 * o * (1 - u * 0.55);
        ctx.moveTo(x - w, y); ctx.lineTo(x + w, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(fade) {
    // trails: cheap persistent fade instead of a clear
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4,7,10,0.055)';
    ctx.fillRect(0, 0, W, H);
  }

  // ---- loop --------------------------------------------------------------
  let last = performance.now();
  let frames = 0;

  function tick(now) {
    const dt = Math.min(50, now - last); last = now;
    draw();

    if (pointer.down) grow(dt);

    for (let i = fronds.length - 1; i >= 0; i--) {
      const f = fronds[i];
      f.stress *= 0.985;
      for (const lf of f.leaflets) {
        if (lf.open < 1) lf.open = Math.min(1, lf.open + 0.0042 * (1 - f.stress * 0.8) * dt * 0.06 * 16);
      }
      const alpha = f.fading > 0 ? Math.max(0, 1 - f.fading) : 1;

      // stem
      ctx.beginPath();
      for (let p = 0; p < f.pts.length; p++) {
        const q = f.pts[p];
        if (p === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      }
      const s = Math.min(1, f.stress);
      ctx.strokeStyle = `rgba(${(70 + 110 * s) | 0},${(122 - 40 * s) | 0},78,${0.30 * alpha})`;
      ctx.lineWidth = 1.35;
      ctx.stroke();

      ctx.globalAlpha = alpha;
      for (const lf of f.leaflets) leaflet(f, lf);
      ctx.globalAlpha = 1;

      // growing tip glow
      if (!f.done && f.fading === 0 && f.pts.length) {
        const h = f.pts[f.pts.length - 1];
        const r = 7 + 4 * Math.sin(now * 0.004);
        const grd = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, r);
        grd.addColorStop(0, 'rgba(190,255,200,0.30)');
        grd.addColorStop(1, 'rgba(190,255,200,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.fill();
      }

      if (f.fading > 0) { f.fading += 0.011; if (f.fading >= 1) fronds.splice(i, 1); }
    }

    frames++;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
